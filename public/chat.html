<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Chat</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #f5f5f5;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #sidebar {
            width: 300px;
            background-color: #f5f5f5;
            padding: 15px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        #content {
            flex: 1;
            padding: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        /* Chat Interface Styles */
        #chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background-color: #fff;
        }
        
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }
        
        .user-message {
            align-self: flex-end;
            background-color: #0b93f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .assistant-message {
            align-self: flex-start;
            background-color: #f1f0f0;
            color: #000;
            border-bottom-left-radius: 4px;
        }
        
        #chat-input-container {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        
        #chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            overflow-y: auto;
        }
        
        #chat-send-btn {
            margin-left: 10px;
            padding: 0 20px;
            background-color: #0b93f6;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        
        #chat-send-btn:hover {
            background-color: #0a84e0;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background-color: #f1f0f0;
            border-radius: 18px;
            width: fit-content;
            margin-top: 5px;
        }
        
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #999;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
        
        .settings-group {
            margin-bottom: 20px;
        }
        .settings-group h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>LLM Chat</h1>
        <p>Chat with an LLM using different models and providers</p>
    </div>
    <div id="main">
        <div id="sidebar">
            <div class="settings-group">
                <h3>LLM Settings</h3>
                <div>
                    <label for="model">Model:</label>
                    <select id="model">
                        <option value="gpt-4">GPT-4</option>
                        <option value="gpt-3.5-turbo" selected>GPT-3.5 Turbo</option>
                        <option value="claude-3">Claude 3</option>
                        <option value="gemini-pro">Gemini Pro</option>
                    </select>
                </div>
                <div>
                    <label for="provider">Provider:</label>
                    <select id="provider">
                        <option value="openai" selected>OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="google">Google</option>
                    </select>
                </div>
            </div>
            
            <div id="metrics">
                <h3>Metrics</h3>
                <div>Prompt tokens: <span id="prompt-tokens">0</span></div>
                <div>Completion tokens: <span id="completion-tokens">0</span></div>
                <div>Total tokens: <span id="total-tokens">0</span></div>
            </div>
        </div>
        <div id="content">
            <!-- Chat Interface -->
            <div id="chat-container">
                <div id="chat-messages">
                    <!-- Messages will be added here dynamically -->
                    <div class="message assistant-message">
                        Hello! How can I help you today?
                    </div>
                </div>
                <div id="chat-input-container">
                    <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
                    <button id="chat-send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        class LLMChat {
            constructor() {
                this.messages = [];
                this.isProcessing = false;
                this.sessionId = `chat-session-${Date.now()}`;
                
                // Add initial welcome message
                this.messages.push({
                    role: 'assistant',
                    content: 'Hello! How can I help you today?'
                });
                
                this.initEventListeners();
            }
            
            initEventListeners() {
                // Send button click
                $('#chat-send-btn').on('click', () => {
                    this.sendMessage();
                });
                
                // Enter key press in input field
                $('#chat-input').on('keydown', (e) => {
                    // Send message on Enter key (without Shift)
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                    
                    // Auto-resize textarea
                    this.resizeTextarea();
                });
                
                // Input field changes for auto-resize
                $('#chat-input').on('input', () => {
                    this.resizeTextarea();
                });
            }
            
            resizeTextarea() {
                const textarea = $('#chat-input')[0];
                
                // Reset height to auto to get the correct scrollHeight
                textarea.style.height = 'auto';
                
                // Set new height based on scrollHeight (with max height limit)
                const newHeight = Math.min(textarea.scrollHeight, 120);
                textarea.style.height = `${newHeight}px`;
            }
            
            sendMessage() {
                // Get message text
                const messageText = $('#chat-input').val().trim();
                
                // Don't send empty messages
                if (!messageText || this.isProcessing) {
                    return;
                }
                
                // Add user message to UI
                this.addMessageToUI('user', messageText);
                
                // Add to messages array
                this.messages.push({
                    role: 'user',
                    content: messageText
                });
                
                // Clear input field
                $('#chat-input').val('');
                this.resizeTextarea();
                
                // Show typing indicator
                this.showTypingIndicator();
                
                // Process with LLM
                this.processWithLLM(messageText);
            }
            
            async processWithLLM(messageText) {
                try {
                    this.isProcessing = true;
                    
                    // Get model and other settings
                    const model = $('#model').val();
                    const provider = $('#provider').val();
                    
                    // Prepare conversation history for context
                    const conversationHistory = this.messages.map(msg => ({
                        role: msg.role,
                        content: msg.content
                    }));
                    
                    // Send to server
                    const response = await $.ajax({
                        url: '/api/chat',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            message: messageText,
                            conversation: conversationHistory,
                            model: model,
                            provider: provider,
                            sessionId: this.sessionId
                        })
                    });
                    
                    // Hide typing indicator
                    this.hideTypingIndicator();
                    
                    // Add response to UI
                    this.addMessageToUI('assistant', response.message);
                    
                    // Add to messages array
                    this.messages.push({
                        role: 'assistant',
                        content: response.message
                    });
                    
                    // Update metrics if available
                    if (response.promptTokens || response.completionTokens || response.totalTokens) {
                        this.updateMetrics(response);
                    }
                    
                    // Scroll to bottom
                    this.scrollToBottom();
                } catch (error) {
                    console.error('Error processing message:', error);
                    
                    // Hide typing indicator
                    this.hideTypingIndicator();
                    
                    // Show error message
                    this.addMessageToUI('assistant', `Sorry, there was an error processing your message: ${error.message || 'Unknown error'}`);
                } finally {
                    this.isProcessing = false;
                }
            }
            
            addMessageToUI(role, content) {
                // Create message element
                const messageClass = role === 'user' ? 'user-message' : 'assistant-message';
                const messageElement = $(`<div class="message ${messageClass}"></div>`);
                
                // Add content
                messageElement.text(content);
                
                // Add to chat container
                $('#chat-messages').append(messageElement);
                
                // Scroll to bottom
                this.scrollToBottom();
            }
            
            showTypingIndicator() {
                // Create typing indicator
                const typingIndicator = $(`
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `);
                
                // Add to chat container
                $('#chat-messages').append(typingIndicator);
                
                // Scroll to bottom
                this.scrollToBottom();
            }
            
            hideTypingIndicator() {
                // Remove typing indicator
                $('.typing-indicator').remove();
            }
            
            scrollToBottom() {
                const chatMessages = $('#chat-messages');
                chatMessages.scrollTop(chatMessages[0].scrollHeight);
            }
            
            updateMetrics(response) {
                // Update token metrics
                $('#prompt-tokens').text(parseInt($('#prompt-tokens').text()) + (response.promptTokens || 0));
                $('#completion-tokens').text(parseInt($('#completion-tokens').text()) + (response.completionTokens || 0));
                $('#total-tokens').text(parseInt($('#total-tokens').text()) + (response.totalTokens || 0));
            }
            
            clearChat() {
                // Clear messages array except for the welcome message
                this.messages = [{
                    role: 'assistant',
                    content: 'Hello! How can I help you today?'
                }];
                
                // Clear chat UI except for the welcome message
                $('#chat-messages').html(`
                    <div class="message assistant-message">
                        Hello! How can I help you today?
                    </div>
                `);
            }
        }

        // Initialize the chat when the document is ready
        $(document).ready(() => {
            window.chat = new LLMChat();
        });
    </script>
</body>
</html>
