<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Embed Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        .pdf-container {
            width: 100%;
            height: 800px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h1>PDF Embed Test</h1>
    <p>This page tests embedding a PDF directly in an iframe.</p>
    
    <div class="pdf-container">
        <iframe src="/sample.pdf"></iframe>
    </div>
    
    <p>If you can see the PDF above, then direct PDF embedding works in your browser.</p>
</body>
</html>
