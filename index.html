<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Reader</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #f5f5f5;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #sidebar {
            width: 300px;
            background-color: #f5f5f5;
            padding: 15px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        #content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .settings-group {
            margin-bottom: 20px;
        }
        .settings-group h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .paragraph {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            position: relative;
        }
        .paragraph:hover {
            background-color: #f9f9f9;
        }
        .paragraph-actions {
            display: none;
            position: absolute;
            right: 10px;
            top: 10px;
        }
        .paragraph:hover .paragraph-actions {
            display: block;
        }
        .btn {
            padding: 8px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #2196F3;
        }
        .btn-secondary:hover {
            background-color: #0b7dda;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.3);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #metrics {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
        #file-drop {
            border: 2px dashed #ccc;
            border-radius: 5px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
        }
        #file-drop.highlight {
            border-color: #2196F3;
            background-color: #e3f2fd;
        }
        .assessment {
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>LLM Reader</h1>
        <p>Upload a PDF and customize your reading experience</p>
    </div>
    <div id="main">
        <div id="sidebar">
            <div id="file-drop">
                <p>Drag & drop your PDF here</p>
                <p>or</p>
                <input type="file" id="file-input" accept=".pdf">
            </div>
            
            <div class="settings-group">
                <h3>Reading Preferences</h3>
                <div>
                    <label for="reading-level">Reading Level:</label>
                    <select id="reading-level" class="preference">
                        <option value="elementary">Elementary</option>
                        <option value="middle-school">Middle School</option>
                        <option value="high-school">High School</option>
                        <option value="college" selected>College</option>
                        <option value="graduate">Graduate</option>
                    </select>
                </div>
                <div>
                    <label for="language">Language:</label>
                    <select id="language" class="preference">
                        <option value="original" selected>Original</option>
                        <option value="english">English</option>
                        <option value="spanish">Spanish</option>
                        <option value="french">French</option>
                        <option value="german">German</option>
                        <option value="chinese">Chinese</option>
                    </select>
                </div>
                <div>
                    <label for="style">Style:</label>
                    <select id="style" class="preference">
                        <option value="original" selected>Original</option>
                        <option value="simple">Simple</option>
                        <option value="academic">Academic</option>
                        <option value="conversational">Conversational</option>
                        <option value="technical">Technical</option>
                    </select>
                </div>
            </div>
            
            <div class="settings-group">
                <h3>LLM Settings</h3>
                <div>
                    <label for="api-key">API Key:</label>
                    <input type="password" id="api-key" placeholder="Enter your API key">
                </div>
                <div>
                    <label for="model">Model:</label>
                    <select id="model">
                        <option value="gpt-4">GPT-4</option>
                        <option value="gpt-3.5-turbo" selected>GPT-3.5 Turbo</option>
                        <option value="claude-3">Claude 3</option>
                        <option value="gemini-pro">Gemini Pro</option>
                    </select>
                </div>
            </div>
            
            <div class="settings-group">
                <h3>Options</h3>
                <div>
                    <input type="checkbox" id="auto-process">
                    <label for="auto-process">Auto-process paragraphs</label>
                </div>
                <div>
                    <input type="checkbox" id="show-assessment">
                    <label for="show-assessment">Show content assessment</label>
                </div>
                <div>
                    <input type="checkbox" id="track-metrics" checked>
                    <label for="track-metrics">Track metrics</label>
                </div>
            </div>
            
            <div class="settings-group">
                <h3>LRS Settings</h3>
                <div>
                    <label for="lrs-endpoint">LRS Endpoint:</label>
                    <input type="text" id="lrs-endpoint" placeholder="https://lrs.example.com/xapi/">
                </div>
                <div>
                    <label for="lrs-username">Username:</label>
                    <input type="text" id="lrs-username">
                </div>
                <div>
                    <label for="lrs-password">Password:</label>
                    <input type="password" id="lrs-password">
                </div>
            </div>
            
            <div id="metrics">
                <h3>Metrics</h3>
                <div>Paragraphs processed: <span id="processed-count">0</span>/<span id="total-count">0</span></div>
                <div>Average latency: <span id="avg-latency">0</span> ms</div>
                <div>Total reading time: <span id="reading-time">0</span> s</div>
            </div>
        </div>
        <div id="content">
            <iframe id="document-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
            <div id="processing-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
                <div style="background-color: white; padding: 20px; border-radius: 5px; max-width: 80%;">
                    <h3>Processing Text</h3>
                    <div id="original-text" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"></div>
                    <div class="loading" style="margin: 10px auto; display: block;"></div>
                    <div id="processed-text" style="margin-top: 15px; max-height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"></div>
                    <div style="margin-top: 15px; text-align: right;">
                        <button id="process-button" class="btn">Process</button>
                        <button id="close-overlay" class="btn btn-secondary">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="reader.js"></script>
</body>
</html>
